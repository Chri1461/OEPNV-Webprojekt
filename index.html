<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>Guess the Station</title>
        <link rel="icon" href="Icons/favicon.ico">
        <link rel="stylesheet" href="style.css">
        <script src="use_input.js"></script>
    </head>
    <body>
        <div id="overlay_container">
            <div id="overlay">
                <h1 id="warning">ACHTUNG!</h1>
                <h3 id="warning">Das Ändern der Einstellungen löscht <br> den Fortschritt der aktuellen Runde</h3>
                <p>- Falls vorhanden -</p>
                <br><br>
                
                <label for="regio">Mit Regional-Bahn-Stationen spielen: </label>
                <input type="checkbox" class="Networks" id="regio">
                <br>
                <label for="cityline">Mit S-Bahn-Stationen spielen: </label>
                <input type="checkbox" class="Networks" id="cityline">
                <br>
                <label for="underground">Mit U-Bahn-Stationen spielen: </label>
                <input type="checkbox" class="Networks" id="underground">
                <br><br>

                <label for="Berlin">Mit Stationen in Berlin spielen: </label>
                <input type="checkbox" class="States" id="Berlin">
                <br>
                <label for="Brandenburg">Mit Stationen in Brandenburg spielen: </label>
                <input type="checkbox" class="States" id="Brandenburg">
                <br>
                <label for="Mecklenburg-Vorpommern">Mit Stationen in Mecklenburg-Vorpommern spielen: </label>
                <input type="checkbox" class="States" id="Mecklenburg-Vorpommern">
                <br>
                <label for="Sachsen">Mit Stationen in Sachsen spielen: </label>
                <input type="checkbox" class="States" id="Sachsen">
                <br>
                <label for="Sachsen-Anhalt">Mit Stationen in Sachsen-Anhalt spielen: </label>
                <input type="checkbox" class="States" id="Sachsen-Anhalt">
                <br>
                <label for="Polen">Mit Stationen in Polen spielen: </label>
                <input type="checkbox" class="States" id="Polen">
            </div>
        </div>

        <p style="text-align: right"><span id="settings">Einstellungen</span></p>
        <h1>Errate die Station!</h1>
        
        <div id="suggest"></div>

        <input id="station_input" type="text" name="stationname" placeholder="Station eingeben" spellcheck="false" value="" autofocus>
        <br>

        <div id="out"></div>
        <div id="next_round"></div>
    </body>
</html>
